<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Shayal Vaghasiya — what I do">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0d1521"/>
    </linearGradient>
    <linearGradient id="waccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f43"/>
      <stop offset="1" stop-color="#fc6d26"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="330" fill="url(#wbg)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="44" cy="34" r="4" fill="#ff9f43"/>
    <text x="60" y="39" font-size="16" font-weight="700" fill="#e6edf3">WHAT I DO</text>
    <text x="180" y="39" font-size="13" fill="#8b949e">delivery automation, end to end — in production every day</text>
  </g>

  <!-- card row 1 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="44" y="68" width="356" height="104" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="64" y="88" width="38" height="38" rx="9" fill="#ff9f43" fill-opacity="0.14" stroke="#ff9f43" stroke-opacity="0.55"/>
    <text x="90" y="113" font-size="15" font-weight="800" fill="#ff9f43" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CI</text>
    <text x="116" y="105" font-size="15" font-weight="700" fill="#e6edf3">CI/CD &amp; Release Automation</text>
    <text x="116" y="124" font-size="12" fill="#8b949e">Jenkins · GitHub Actions · Bitbucket Pipelines</text>

    <rect x="422" y="68" width="356" height="104" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="442" y="88" width="38" height="38" rx="9" fill="#a371f7" fill-opacity="0.14" stroke="#a371f7" stroke-opacity="0.55"/>
    <text x="468" y="113" font-size="15" font-weight="800" fill="#a371f7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">IaC</text>
    <text x="494" y="105" font-size="15" font-weight="700" fill="#e6edf3">Infrastructure as Code</text>
    <text x="494" y="124" font-size="12" fill="#8b949e">Terraform · Ansible · versioned environments</text>

    <rect x="800" y="68" width="356" height="104" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="820" y="88" width="38" height="38" rx="9" fill="#79c0ff" fill-opacity="0.14" stroke="#79c0ff" stroke-opacity="0.55"/>
    <text x="846" y="113" font-size="15" font-weight="800" fill="#79c0ff" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">C</text>
    <text x="872" y="105" font-size="15" font-weight="700" fill="#e6edf3">Cloud Platforms</text>
    <text x="872" y="124" font-size="12" fill="#8b949e">AWS · GCP — landing zones &amp; networking</text>
  </g>

  <!-- card row 2 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="44" y="186" width="356" height="104" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="64" y="206" width="38" height="38" rx="9" fill="#39c5cf" fill-opacity="0.14" stroke="#39c5cf" stroke-opacity="0.55"/>
    <text x="90" y="231" font-size="15" font-weight="800" fill="#39c5cf" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">CT</text>
    <text x="116" y="223" font-size="15" font-weight="700" fill="#e6edf3">Containers &amp; Services</text>
