    <rect x="422" y="186" width="356" height="104" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="442" y="206" width="38" height="38" rx="9" fill="#ff7b72" fill-opacity="0.14" stroke="#ff7b72" stroke-opacity="0.55"/>
    <text x="468" y="231" font-size="15" font-weight="800" fill="#ff7b72" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">OB</text>
    <text x="494" y="223" font-size="15" font-weight="700" fill="#e6edf3">Observability</text>
    <text x="494" y="242" font-size="12" fill="#8b949e">Grafana · Prometheus · CloudWatch</text>

    <rect x="800" y="186" width="356" height="104" rx="14" fill="#161b22" stroke="#30363d"/>
    <rect x="820" y="206" width="38" height="38" rx="9" fill="#f85149" fill-opacity="0.14" stroke="#f85149" stroke-opacity="0.55"/>
    <text x="846" y="231" font-size="15" font-weight="800" fill="#f85149" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SC</text>
    <text x="872" y="223" font-size="15" font-weight="700" fill="#e6edf3">Security Scanning</text>
