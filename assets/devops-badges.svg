<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-label="DevOps skills badges">
  <defs>
    <style>
      .lbl { font: bold 13px 'DejaVu Sans Mono', monospace; fill: #c9d1d9; }
      .pct { font: bold 12px 'DejaVu Sans Mono', monospace; fill: #8b949e; }
      .row { font: 13px 'DejaVu Sans Mono', monospace; fill: #e6edf3; }
    </style>
  </defs>
  <text x="40" y="60" font-family="'DejaVu Sans Mono', monospace" font-size="22" font-weight="bold" fill="#58a6ff">// skills matrix</text>
  <g font-family="'DejaVu Sans Mono', monospace">
    <text x="40" y="110" class="row">argocd</text>
    <text x="230" y="110" class="row">gitops</text>
    <text x="420" y="110" class="row">terraform</text>
    <text x="638" y="110" class="row">ansible</text>
    <text x="850" y="110" class="row">docker</text>
    <text x="1030" y="110" class="row">kubernetes</text>
    <text x="40" y="170" class="row">jenkins</text>
    <text x="230" y="170" class="row">github-actions</text>
    <text x="430" y="170" class="row">linux</text>
    <text x="620" y="170" class="row">python</text>
    <text x="820" y="170" class="row">bash</text>
    <text x="1010" y="170" class="row">grafana</text>
    <text x="40" y="230" class="row">prometheus</text>
    <text x="268" y="230" class="row">nginx</text>
    <text x="455" y="230" class="row">cloud</text>
    <text x="650" y="230" class="row">postgres</text>
    <text x="870" y="230" class="row">monitoring</text>
    <text x="1080" y="230" class="row">design</text>
  </g>
  <g font-family="'DejaVu Sans Mono', monospace">
    <text x="40" y="320" font-size="15" fill="#8b949e">folders / automation /</text>
    <text x="245" y="320" font-size="15" fill="#3fb950">workflows /</text>
    <text x="490" y="320" font-size="15" fill="#8b949e">infra /</text>
    <text x="610" y="320" font-size="15" fill="#3fb950">prod /</text>
    <text x="710" y="320" font-size="15" fill="#8b949e">monitoring</text>
    <text x="40" y="390" font-size="17" fill="#7ee787">status ~> healthy.</text>
    <text x="280" y="390" font-size="13" fill="#8b949e">deploys ~> green</text>
  </g>
</svg>
