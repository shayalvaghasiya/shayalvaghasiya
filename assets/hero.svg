    <text x="72" y="217" fill="#58a6ff">AWS</text>
    <rect x="188" y="196" width="140" height="34" rx="17" fill="#12273d" stroke="#388bfd"/>
    <text x="212" y="217" fill="#388bfd">Docker</text>
    <rect x="340" y="196" width="160" height="34" rx="17" fill="#12273d" stroke="#a371f7"/>
    <text x="366" y="217" fill="#a371f7">Kubernetes</text>
    <rect x="512" y="196" width="146" height="34" rx="17" fill="#12273d" stroke="#3fb950"/>
    <text x="538" y="217" fill="#3fb950">Terraform</text>
    <rect x="670" y="196" width="140" height="34" rx="17" fill="#12273d" stroke="#f0883e"/>
    <text x="694" y="217" fill="#f0883e">CI/CD</text>
  </g>

  <g font-family="monospace, monospace" font-size="13" fill="#8b949e">
    <text x="48" y="286">AUTOMATE</text>
    <text x="154" y="286" fill="#3fb950">→</text>
    <text x="186" y="286">SCALE</text>
    <text x="254" y="286" fill="#3fb950">→</text>
    <text x="286" y="286">OBSERVE</text>
    <text x="366" y="286" fill="#3fb950">→</text>
    <text x="398" y="286">RELEASE</text>
  </g>

