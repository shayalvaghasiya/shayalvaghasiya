    <text x="842" y="92" font-size="18" font-weight="bold" fill="#58a6ff">// platform dashboard</text>

    <rect x="842" y="112" width="14" height="14" rx="3" fill="#3fb950"/>
    <text x="866" y="124" font-size="14" fill="#c9d1d9">01 · pipelines</text>
    <text x="1006" y="124" font-size="14" fill="#7ee787">PASSING</text>

    <rect x="842" y="140" width="14" height="14" rx="3" fill="#f0883e"/>
    <text x="866" y="152" font-size="14" fill="#c9d1d9">02 · containers</text>
    <text x="1006" y="152" font-size="14" fill="#ffd76e">RUNNING</text>

    <rect x="842" y="168" width="14" height="14" rx="3" fill="#a371f7"/>
    <text x="866" y="180" font-size="14" fill="#c9d1d9">03 · clusters</text>
    <text x="1006" y="180" font-size="14" fill="#a371f7">HEALTHY</text>

    <rect x="842" y="196" width="14" height="14" rx="3" fill="#58a6ff"/>
